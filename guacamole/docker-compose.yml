# guacamole and guacd versions must always match, see README before upgrading
services:
  # One-shot container that generates the database schema script used by postgres on first start
  initdb:
    image: guacamole/guacamole:1.6.0
    restart: "no"
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["/opt/guacamole/bin/initdb.sh --postgresql > /initdb/initdb.sql"]
    volumes:
      - initdb_volume:/initdb
    network_mode: none

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      initdb:
        condition: service_completed_successfully
    env_file:
      - /root/vault/guacamole_db.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      # Scripts in this folder are executed only when the database volume is empty
      - initdb_volume:/docker-entrypoint-initdb.d:ro
      - database_volume:/var/lib/postgresql/data
    networks:
      - guacamole_db

  # Proxy daemon that opens the RDP/VNC/SSH connections towards the machines on the local network
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - guacamole_db

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      - db
      - guacd
    # Do not pass any POSTGRES_* variable to this container: the 1.6.0 entrypoint migrates the legacy
    # POSTGRES_ prefix to POSTGRESQL_ and, due to a bug, ends up overwriting POSTGRESQL_PASSWORD with an empty value
    env_file:
      - /root/vault/guacamole.env
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: db
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      # Serve the web app on / instead of /guacamole
      WEBAPP_CONTEXT: ROOT
      # Trust X-Forwarded-For from Traefik so the real client IP shows up in logs and history
      REMOTE_IP_VALVE_ENABLED: "true"
      # The service is reachable from the internet, require a second factor for every user
      TOTP_ENABLED: "true"
    networks:
      - guacamole_db
      - guacamole

volumes:
  initdb_volume:
  database_volume:

networks:
  guacamole:
    external: true
  guacamole_db:
    external: true
